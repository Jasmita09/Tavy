<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TΛVY — Feel the music. Together.</title>
    <meta name="description" content="Two concert experiences, live and at home, with visual beats, lyrics, optional haptics and sensory settings. Designed with Deaf and hard-of-hearing audiences in mind." />
    <meta property="og:title" content="TΛVY — Feel the music. Together." />
    <meta property="og:description" content="Two concert experiences, live and at home, with visual beats, lyrics, optional haptics and sensory settings. Designed with Deaf and hard-of-hearing audiences in mind." />
    <meta name="theme-color" content="#FBF7EF" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Concert Experience (ported from AuraBeat) design tokens. Values live as CSS variables in
      // index.css so the High Contrast preference can swap them.
      const abColor = (name) => `rgb(var(--ab-${name}) / <alpha-value>)`;
      // TΛVY site design tokens (bright system). Values live in index.css as --tv-* variables.
      const tvColor = (name) => `rgb(var(--tv-${name}) / <alpha-value>)`;
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              stage: abColor('stage'),
              surface: { DEFAULT: abColor('surface'), raised: abColor('surface-raised') },
              ink: { DEFAULT: abColor('ink'), muted: abColor('ink-muted') },
              aura: abColor('aura'),
              anticipate: abColor('anticipate'),
              alert: abColor('alert'),
              tv: {
                canvas: tvColor('canvas'),
                paper: tvColor('paper'),
                mist: tvColor('mist'),
                navy: tvColor('navy'),
                slate: tvColor('slate'),
                line: tvColor('line'),
                accent: tvColor('accent'),
                'accent-ink': tvColor('accent-ink'),
                blush: tvColor('blush'),
                sky: tvColor('sky'),
                peach: tvColor('peach'),
              },
            },
            fontFamily: {
              display: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              serif: ['"Instrument Serif"', 'Georgia', 'serif'],
            },
            borderRadius: {
              'tv-sm': 'var(--tv-radius-sm)',
              'tv-md': 'var(--tv-radius-md)',
              'tv-lg': 'var(--tv-radius-lg)',
              'tv-xl': 'var(--tv-radius-xl)',
            },
            boxShadow: {
              'tv-soft': 'var(--tv-shadow-soft)',
              'tv-lift': 'var(--tv-shadow-lift)',
            },
            animation: {
              'aura-drift': 'aura-drift 18s ease-in-out infinite alternate',
              rise: 'rise 700ms cubic-bezier(0.2, 0.7, 0.2, 1) both',
              burst: 'burst 1400ms cubic-bezier(0.1, 0.6, 0.3, 1) both',
              'glow-in': 'glow-in 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both',
              'float-up': 'float-up 16s linear infinite',
              particle: 'particle 1300ms cubic-bezier(0.15, 0.7, 0.3, 1) both',
              'wave-flow': 'wave-flow 2.6s linear infinite',
              'crowd-ripple': 'crowd-ripple 1100ms ease-out both',
              'beam-open': 'beam-open 1600ms cubic-bezier(0.2, 0.7, 0.2, 1) both',
              shimmer: 'shimmer 1400ms ease-out both',
              'lyric-in': 'lyric-in 320ms ease-out both',
              'spot-sweep': 'spot-sweep 7s ease-in-out infinite alternate',
              'ring-out': 'ring-out 6s ease-out infinite',
              'ring-in': 'ring-in 3.2s ease-in infinite',
              'flow-x': 'flow-x 26s linear infinite',
              'rise-stripes': 'rise-stripes 0.8s linear infinite',
              'rotate-slow': 'rotate-slow 48s linear infinite',
              'strip-move': 'strip-move 7s ease-in-out infinite alternate',
              aurora: 'aurora 14s ease-in-out infinite alternate',
              twinkle: 'twinkle 2.8s ease-in-out infinite alternate',
              'haze-drift': 'haze-drift 28s ease-in-out infinite alternate',
              'float-slow': 'float-slow 18s linear infinite',
              'camera-drift': 'camera-drift 18s ease-in-out infinite alternate',
              'aura-ring': 'aura-ring 1.8s cubic-bezier(0.15, 0.6, 0.3, 1) both',
              'aura-bloom': 'aura-bloom 2.2s cubic-bezier(0.15, 0.6, 0.3, 1) both',
              'link-draw': 'link-draw 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) both',
              'floor-wave': 'floor-wave 1.8s cubic-bezier(0.15, 0.6, 0.3, 1) both',
              'beam-sweep': 'beam-sweep 5s ease-in-out infinite alternate',
              'live-breathe': 'live-breathe 4s ease-in-out infinite alternate',
              'live-flash': 'live-flash 480ms ease-out both',
              'live-spin': 'live-spin 14s linear infinite',
              'live-cue': 'live-cue 1800ms ease-out both',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600;1,700&family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        -ms-overflow-style: none;
        scrollbar-width: thin;
        scrollbar-color: rgba(23, 21, 46, 0.15) transparent;
      }
      
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 3px;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #FBF7EF;
        color: #17152E;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .font-editorial-serif {
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      .font-halo {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        letter-spacing: 0.02em;
      }
      .font-mono-tech {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
      }

      @keyframes pulse-subtle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .animate-pulse-subtle {
        animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
<link rel="stylesheet" href="./index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
